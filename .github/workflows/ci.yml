name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Type · Test · Security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,api,lab]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Mypy (type check)
        run: mypy src

      - name: Pytest (unit + integration)
        run: pytest --cov=redprompt --cov-report=xml --cov-report=term-missing

      - name: Offline domain-core harness (stdlib only)
        run: PYTHONPATH=src python -m unittest discover -s tests_offline

      - name: Bandit (SAST on RedPrompt itself)
        run: bandit -c pyproject.toml -r src

      - name: pip-audit (dependency vulnerabilities)
        run: pip install pip-audit && pip-audit || true  # advisory, non-blocking

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t redprompt:ci .
      - name: Validate lab compose
        run: docker compose -f redprompt-lab/docker-compose.yml config >/dev/null
      - name: Smoke test CLI
        run: docker run --rm redprompt:ci version
