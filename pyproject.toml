[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redprompt"
version = "0.1.0"
description = "RedPrompt: AI Application Security Testing & Red Teaming Platform for authorized, controlled assessment of LLM, RAG, and agentic applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Architha Krishnaprakash" }]
keywords = [
    "ai-security",
    "llm-security",
    "red-teaming",
    "appsec",
    "prompt-injection",
    "security-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
lab = ["starlette>=0.37", "uvicorn[standard]>=0.29"]
pdf = ["weasyprint>=61.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
redprompt = "redprompt.cli.main:app"

[project.urls]
Homepage = "https://github.com/architha/redprompt"
Documentation = "https://github.com/architha/redprompt/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redprompt = ["reporting/templates/*.html", "py.typed"]

# ---------------------------------------------------------------------------
# Quality tooling
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "S101", # asserts are fine in tests
    "E501", # line length handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/redprompt/lab/**" = ["S"]          # lab is intentionally vulnerable by design
"src/redprompt/tests_plugins/**" = ["S105", "S106"]  # illustrative test payloads

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["^src/redprompt/lab/", "^migrations/"]

[[tool.mypy.overrides]]
module = ["weasyprint.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that exercise the lab",
    "slow: slower tests",
]

[tool.coverage.run]
source = ["redprompt"]
omit = ["src/redprompt/lab/*", "*/migrations/*"]

[tool.bandit]
# The vulnerable lab is intentionally insecure; never scan it as product code.
exclude_dirs = ["tests", "tests_offline", "redprompt-lab", "src/redprompt/lab"]
skips = ["B101"]  # assert_used (tests)
